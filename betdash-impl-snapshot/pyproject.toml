[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "betdash"
version = "0.1.0"
description = "Local betting-research dashboard for public pre-match odds"
requires-python = ">=3.14"
dependencies = [
    "pytest>=8",
    "pydantic-settings>=2",
    "SQLAlchemy>=2",
    "alembic>=1.13",
    "httpx>=0.27",
    "lxml>=5",
    "websockets>=13",
    "APScheduler>=3.10",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "duckdb>=1.1",
    "streamlit>=1.39",
    "plotly>=5.24",
    "pystray>=0.19",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
betdash = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
